name: grand_line
description: "Free, ad-free, open-source app for streaming and downloading One Pace episodes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter_riverpod: ^3.0.0
  path_provider: ^2.1.0
  riverpod_annotation: ^3.0.0
  supabase_flutter: ^2.0.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # TODO: re-add custom_lint + riverpod_lint once the custom_lint client
  # generation bug on this machine (stale riverpod_lint-3.1.4 reference) is
  # resolved; layer rules are enforced by test/architecture_test.dart.
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
