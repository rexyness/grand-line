# Belt-and-braces against Supabase's free-tier 1-week API-inactivity pause
# (spec §10.3; the pg_cron jobs are the primary keep-alive — see
# supabase/README.md). Anonymous read, RLS-safe, negligible quota.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping catalog REST endpoint
        run: |
          URL=$(jq -r .SUPABASE_URL dart_defines.json)
          KEY=$(jq -r .SUPABASE_ANON_KEY dart_defines.json)
          curl -sf "$URL/rest/v1/arcs?select=id&limit=1" -H "apikey: $KEY" -o /dev/null
          echo "Supabase reachable."
