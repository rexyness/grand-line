# Release pipeline (spec §10.1–10.3): tag vX.Y.Z → 4-platform matrix →
# one atomic GitHub Release. `workflow_dispatch` is the dry run — it builds
# every artifact but publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  # Tag must match pubspec.yaml's version (spec §10.2); computes the
  # version label the artifact names carry.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and guard version
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" != "v${PUBSPEC_VERSION}" ]]; then
              echo "::error::Tag $TAG does not match pubspec.yaml version ${PUBSPEC_VERSION}"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=v${PUBSPEC_VERSION}-dry" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Refresh vendored catalog snapshot
        shell: bash
        run: sh tool/update_snapshot.sh
      - run: flutter pub get
      - run: flutter build windows --release --dart-define-from-file=dart_defines.json
      - name: Zip release bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "grand-line-${{ needs.prepare.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: grand-line-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev
      - name: Refresh vendored catalog snapshot
        run: sh tool/update_snapshot.sh
      - run: flutter pub get
      - run: flutter build linux --release --dart-define-from-file=dart_defines.json
      - name: Tar release bundle
        run: |
          tar -czf "grand-line-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: grand-line-*-linux-x64.tar.gz
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Refresh vendored catalog snapshot
        run: sh tool/update_snapshot.sh
      - run: flutter pub get
      - name: Write signing config
        # Without the secrets (dry runs before the keystore exists) the
        # build falls back to debug signing — installable, not updatable.
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build fat APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json
      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=dart_defines.json
      - name: Rename APKs
        run: |
          V="${{ needs.prepare.outputs.version }}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "grand-line-$V-android.apk"
          mv app-armeabi-v7a-release.apk "grand-line-$V-android-armeabi-v7a.apk"
          mv app-arm64-v8a-release.apk "grand-line-$V-android-arm64-v8a.apk"
          mv app-x86_64-release.apk "grand-line-$V-android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/grand-line-*.apk
          if-no-files-found: error

  build-ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Refresh vendored catalog snapshot
        run: sh tool/update_snapshot.sh
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define-from-file=dart_defines.json
      - name: Package unsigned IPA
        # An IPA is a zip containing Payload/Runner.app; sideloading tools
        # (AltStore/Sideloadly) re-sign it on the user's machine (spec §10.1).
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "grand-line-${{ needs.prepare.outputs.version }}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: grand-line-*-ios-unsigned.ipa
          if-no-files-found: error

  # Atomic release (spec §10.1): appears only when every platform built.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build-windows, build-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
