include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - prefer_single_quotes
    - unawaited_futures
    - directives_ordering

# Layer/import rules (features -> data only; engine packages stay behind their
# shim folder) are enforced by test/architecture_test.dart, which runs in CI.
